@switch (mode()) { @case ('verify-otp') {
<app-verify-otp [email]="email()" (changeMode)="handleChangeMode($event)" />
} @case ('reset-password') {
<app-reset-password [email]="email()" />
} @default {
<!-- forgot password form -->
<div class="md:w-[28.25rem] w-full">
  <h4 class="text-gray-800 text-2xl font-bold mb-3 font-inter">
    Forgot Password
  </h4>

  <p class="text-gray-500 text-sm mb-10">
    Don't worry, we will help you recover your account.
  </p>

  <form [formGroup]="forgotPasswordForm" (ngSubmit)="continue()">
    <div class="mb-10">
      <label class="block text-gray-800 font-medium mb-2" for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        placeholder="user@example.com"
        formControlName="email"
        class="w-full border border-gray-200 p-2 placeholder:text-gray-400"
        required
        appFieldError
        errorClass="border-red-500" />

      <app-field-error controlName="email" errorKey="required" />

      <app-field-error controlName="email" errorKey="email" />
    </div>

    <app-button
      buttonType="submit"
      buttonClass="flex items-center justify-center gap-2"
      [disabled]="isLoading()">
      Continue @if (!isLoading()) {
      <svg
        width="18"
        height="18"
        viewBox="0 0 18 18"
        fill="none"
        xmlns="http://www.w3.org/2000/svg">
        <path
          d="M13.5 6L16.5 9M16.5 9L13.5 12M16.5 9H1.5"
          stroke="white"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
      }
    </app-button>

    <app-api-error-message [errorMessage]="errorMessage()" />

    <div class="text-center text-gray-500 text-sm font-medium mt-9">
      Don't have an account?
      <a
        [routerLink]="['/' + appRoutes.auth.root, appRoutes.auth.register]"
        class="text-blue-600">
        Create yours
      </a>
    </div>
  </form>
</div>
} }
