@if (subjects().length) {
<section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
  @for(subject of subjects(); track subject._id; let i = $index) {
  <a [routerLink]="[subject._id, appRoutes.dashboard.exams]" class="relative">
    <h3
      class="absolute start-2 bottom-2 h-[4.25rem] w-[calc(100%-1rem)] backdrop-blur-sm bg-[#155DFC80] text-white px-4 py-5 text-xl font-geist-mono">
      {{ subject.name }}
    </h3>

    <img
      [src]="subject.icon"
      [alt]="subject.name"
      class="w-full h-[28rem] object-cover" />
  </a>
  }
</section>

@if (!isLoading() && (meta().currentPage <= meta().numberOfPages)) {
<button
  class="mt-6 flex flex-col justify-center items-center gap-1 text-gray-600 w-full"
  (click)="loadMore()">
  <span class="font-normal font-geist-mono text-base">Scroll to view more</span>

  <svg
    width="18"
    height="18"
    class="size-[1.125rem]"
    viewBox="0 0 18 18"
    fill="none"
    xmlns="http://www.w3.org/2000/svg">
    <path
      d="M4.5 6.75L9 11.25L13.5 6.75"
      stroke="currentColor"
      stroke-width="0.9375"
      stroke-linecap="round"
      stroke-linejoin="round" />
  </svg>
</button>
} } @if (!subjects().length && !isLoading()) {
<div
  class="pt-20 text-center font-geist-mono font-normal text-gray-600 text-xl">
  No data found
</div>
} @if (isLoading()) {
<div
  class="flex items-center justify-center"
  [class.pt-6]="subjects().length"
  [class.pt-20]="!subjects().length">
  <svg
    class="size-16 animate-spin text-blue-600"
    xmlns="http://www.w3.org/2000/svg"
    fill="none"
    viewBox="0 0 24 24">
    <circle
      class="opacity-25"
      cx="12"
      cy="12"
      r="10"
      stroke="currentColor"
      stroke-width="4"></circle>
    <path
      class="opacity-75"
      fill="currentColor"
      d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
  </svg>
</div>
}
