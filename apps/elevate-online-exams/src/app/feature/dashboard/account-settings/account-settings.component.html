<section class="flex gap-6 font-geist-mono h-[calc(100%-6.5rem)]">
  <!-- Sidebar Navigation -->
  <app-account-settings-sidebar
    [activeTab]="activeTab()"
    (changeActiveTab)="setActiveTab($event)"
    (triggerLogout)="logout()" />

  <!-- Main Content -->
  <div class="flex-1 bg-white border border-gray-100 p-6">
    <!-- Profile Tab -->
    @if (activeTab() === 'profile') {
    <app-profile
      [profileForm]="profileForm"
      [isLoading]="isLoading()"
      (showDeleteAccountModal)="openDeleteAccountModal()"
      (updateProfile)="saveProfile()" />
    }

    <!-- Change Password Tab -->
    @if (activeTab() === 'password') {
    <app-change-password
      [passwordForm]="passwordForm"
      [isLoading]="isLoading()"
      (changePassword)="changePassword()" />
    }
  </div>
</section>

<ng-template #deleteAccountModal>
  <div class="flex justify-center">
    <svg
      width="120"
      height="120"
      viewBox="0 0 120 120"
      class="size-30"
      fill="none"
      xmlns="http://www.w3.org/2000/svg">
      <circle cx="60" cy="59.5" r="55" fill="#FEF2F2" />
      <circle cx="60" cy="59.5" r="40" fill="#FEE2E2" />
      <path
        d="M60 53.7501V62.0835M60 70.4168H60.0208M80.2708 72.5001L63.6041 43.3335C63.2407 42.6922 62.7137 42.1589 62.0769 41.7878C61.4401 41.4167 60.7162 41.2212 59.9791 41.2212C59.2421 41.2212 58.5182 41.4167 57.8814 41.7878C57.2446 42.1589 56.7175 42.6922 56.3541 43.3335L39.6875 72.5001C39.3201 73.1363 39.1275 73.8583 39.1292 74.5929C39.1308 75.3275 39.3266 76.0486 39.6967 76.6831C40.0669 77.3176 40.5982 77.843 41.2368 78.206C41.8755 78.569 42.5987 78.7567 43.3333 78.7501H76.6666C77.3977 78.7494 78.1157 78.5563 78.7485 78.1903C79.3813 77.8243 79.9067 77.2982 80.2719 76.665C80.6371 76.0317 80.8292 75.3134 80.829 74.5824C80.8288 73.8514 80.6363 73.1332 80.2708 72.5001Z"
        stroke="#DC2626"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round" />
    </svg>
  </div>

  <div class="mt-8 mb-14 text-center">
    <p class="text-lg font-medium text-red-600 mb-2">
      Are you sure you want to delete your account?
    </p>

    <p class="text-sm font-normal text-gray-500">
      This action is permanent and cannot be undone.
    </p>
  </div>

  <div
    class="flex items-center justify-center gap-4 p-6 bg-gray-50 border-t border-gray-200">
    <button
      type="button"
      (click)="closeModal()"
      class="px-6 py-4 text-gray-800 bg-gray-200 hover:bg-gray-300 font-medium transition-all duration-200 text-sm w-[13.5rem]">
      Cancel
    </button>

    <button
      type="button"
      (click)="deleteAccount()"
      class="px-6 py-4 bg-red-600 text-white font-medium hover:bg-red-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition-all duration-200 text-sm w-[13.5rem]">
      Yes, delete
    </button>
  </div>
</ng-template>
