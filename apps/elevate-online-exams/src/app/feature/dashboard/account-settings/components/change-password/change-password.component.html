<form
  [formGroup]="passwordForm()"
  (ngSubmit)="changePassword.emit()"
  class="w-full">
  <!-- Current Password -->
  <div class="mb-4 border-b border-gray-200 pb-6">
    <label
      class="block text-base font-medium text-gray-800 mb-1"
      for="oldPassword">
      Current Password
    </label>

    <div class="relative">
      <input
        [type]="showPassword().old ? 'text' : 'password'"
        id="oldPassword"
        formControlName="oldPassword"
        class="w-full px-4 py-2 border border-gray-200 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        placeholder="Enter current password" />

      <button
        type="button"
        (click)="togglePasswordVisibility('old')"
        class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
        @if (showPassword().old) {
        <ng-container [ngTemplateOutlet]="showPasswordIcon" />
        } @else {
        <ng-container [ngTemplateOutlet]="hidePasswordIcon" />
        }
      </button>
    </div>
  </div>

  <!-- New Password -->
  <div class="mb-4">
    <label
      class="block text-base font-medium text-gray-800 mb-1"
      for="password">
      New Password
    </label>

    <div class="relative">
      <input
        [type]="showPassword().new ? 'text' : 'password'"
        id="password"
        formControlName="password"
        class="w-full px-4 py-2 border border-gray-200 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        placeholder="Enter new password" />

      <button
        type="button"
        (click)="togglePasswordVisibility('new')"
        class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
        @if (showPassword().new) {
        <ng-container [ngTemplateOutlet]="showPasswordIcon" />
        } @else {
        <ng-container [ngTemplateOutlet]="hidePasswordIcon" />
        }
      </button>
    </div>
  </div>

  <!-- Confirm Password -->
  <div class="mb-6">
    <label
      class="block text-base font-medium text-gray-800 mb-1"
      for="rePassword">
      Confirm New Password
    </label>

    <div class="relative">
      <input
        [type]="showPassword().confirm ? 'text' : 'password'"
        id="rePassword"
        formControlName="rePassword"
        class="w-full px-4 py-2 border border-gray-200 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        placeholder="Confirm new password" />

      <button
        type="button"
        (click)="togglePasswordVisibility('confirm')"
        class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
        @if (showPassword().confirm) {
        <ng-container [ngTemplateOutlet]="showPasswordIcon" />
        } @else {
        <ng-container [ngTemplateOutlet]="hidePasswordIcon" />
        }
      </button>
    </div>
  </div>

  <app-api-error-message [errorMessage]="errorMessage()" />

  <!-- Submit Button -->
  <button
    type="submit"
    [disabled]="!passwordForm().valid || isLoading()"
    class="w-full px-8 py-2.5 bg-blue-600 text-white font-medium hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition-all duration-200 text-sm">
    {{ isLoading() ? 'Changing...' : 'Update Password' }}
  </button>
</form>

<ng-template #showPasswordIcon>
  <svg
    width="20"
    height="20"
    viewBox="0 0 20 20"
    class="size-5 text-gray-400"
    fill="none"
    xmlns="http://www.w3.org/2000/svg">
    <path
      d="M2.5 10C2.5 10 5.83333 4.16667 10 4.16667C14.1667 4.16667 17.5 10 17.5 10C17.5 10 14.1667 15.8333 10 15.8333C5.83333 15.8333 2.5 10 2.5 10Z"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round" />
    <path
      d="M10 12.5C11.3807 12.5 12.5 11.3807 12.5 10C12.5 8.61929 11.3807 7.5 10 7.5C8.61929 7.5 7.5 8.61929 7.5 10C7.5 11.3807 8.61929 12.5 10 12.5Z"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round" />
  </svg>
</ng-template>

<ng-template #hidePasswordIcon>
  <svg
    width="20"
    height="20"
    viewBox="0 0 20 20"
    fill="none"
    class="size-5 text-gray-400"
    xmlns="http://www.w3.org/2000/svg">
    <path
      d="M2.5 10C2.5 10 5.83333 4.16667 10 4.16667C14.1667 4.16667 17.5 10 17.5 10C17.5 10 14.1667 15.8333 10 15.8333C5.83333 15.8333 2.5 10 2.5 10Z"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round" />
    <path
      d="M10 12.5C11.3807 12.5 12.5 11.3807 12.5 10C12.5 8.61929 11.3807 7.5 10 7.5C8.61929 7.5 7.5 8.61929 7.5 10C7.5 11.3807 8.61929 12.5 10 12.5Z"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round" />
    <path
      d="M3.33333 3.33333L16.6667 16.6667"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round" />
  </svg>
</ng-template>
