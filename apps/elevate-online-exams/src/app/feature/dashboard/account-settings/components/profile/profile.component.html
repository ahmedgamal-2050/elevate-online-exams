<form [formGroup]="profileForm()" (ngSubmit)="saveProfile()">
  <div class="grid grid-cols-2 gap-4 mb-4">
    <!-- First Name -->
    <div>
      <label
        class="block text-base font-medium text-gray-800 mb-1"
        for="firstName">
        First name
      </label>
      <input
        type="text"
        id="firstName"
        formControlName="firstName"
        class="w-full px-4 py-2 border border-gray-200 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        placeholder="Ahmed" />
    </div>

    <!-- Last Name -->
    <div>
      <label
        class="block text-base font-medium text-gray-800 mb-1"
        for="lastName">
        Last name
      </label>
      <input
        type="text"
        id="lastName"
        formControlName="lastName"
        class="w-full px-4 py-2 border border-gray-200 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        placeholder="Abdullah" />
    </div>
  </div>

  <!-- Username -->
  <div class="mb-4">
    <label
      class="block text-base font-medium text-gray-800 mb-1"
      for="username">
      Username
    </label>
    <input
      type="text"
      id="username"
      formControlName="username"
      class="w-full px-4 py-2 border border-gray-200 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
      placeholder="user123" />
  </div>

  <!-- Email -->
  <div class="mb-4">
    <label class="block text-base font-medium text-gray-800 mb-1" for="email">
      Email
    </label>
    <input
      type="email"
      id="email"
      formControlName="email"
      class="w-full px-4 py-2 border border-gray-200 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
      placeholder="user@example.com" />
  </div>

  <!-- Phone -->
  <div class="mb-8">
    <label class="block text-base font-medium text-gray-800 mb-1" for="phone">
      Phone
    </label>
    <div
      class="flex border border-gray-200 overflow-hidden focus-within:ring-2 focus-within:ring-blue-500">
      <div
        class="flex items-center gap-2 px-3 bg-gray-50 border-r border-gray-200">
        <svg
          width="22"
          height="16"
          viewBox="0 0 22 16"
          fill="none"
          xmlns="http://www.w3.org/2000/svg">
          <rect x="0" y="0" width="22" height="5.33" fill="#CE1126" />
          <rect x="0" y="5.33" width="22" height="5.34" fill="#FFFFFF" />
          <rect x="0" y="10.67" width="22" height="5.33" fill="#000000" />
        </svg>
        <span class="text-sm text-gray-700">EG(+20)</span>
      </div>
      <input
        type="tel"
        id="phone"
        formControlName="phone"
        class="flex-1 px-4 py-2 focus:outline-none"
        placeholder="1012345678" />
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="flex items-center gap-4">
    <button
      type="button"
      (click)="openDeleteAccountModal()"
      class="px-6 py-4 text-red-600 bg-red-50 hover:bg-red-100 font-medium transition-all duration-200 flex-1 text-sm">
      Delete My Account
    </button>

    <button
      type="submit"
      [disabled]="!profileForm().valid || isLoading()"
      class="px-8 py-4 bg-blue-600 text-white font-medium hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition-all duration-200 flex-1 text-sm">
      {{ isLoading() ? 'Saving...' : 'Save Changes' }}
    </button>
  </div>
</form>
