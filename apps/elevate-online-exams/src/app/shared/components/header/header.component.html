<section class="flex gap-2 items-center mb-6 h-20">
  @if (header().hasBackButton) {
  <button
    type="button"
    class="flex items-center justify-center text-blue-600 border border-blue-600 h-full"
    (click)="goBack()">
    <svg
      width="24"
      height="24"
      viewBox="0 0 24 24"
      class="size-6"
      fill="none"
      xmlns="http://www.w3.org/2000/svg">
      <path
        d="M15 18L9 12L15 6"
        stroke="currentColor"
        stroke-width="1.25"
        stroke-linecap="round"
        stroke-linejoin="round" />
    </svg>
  </button>
  }

  <header
    class="bg-blue-600 text-white p-4 flex items-center gap-4 h-full w-full">
    <span [innerHTML]="header().icon"></span>
    <h1 class="font-semibold text-[2rem]">{{ header().title }}</h1>
  </header>
</section>
