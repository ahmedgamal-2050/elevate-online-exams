<aside class="w-[22.625rem] bg-blue-50 p-10 h-screen fixed">
  <header>
    <div class="mb-2">
      <img
        src="./assets/images/final_logo.png"
        alt="elevate-logo"
        class="w-[12rem]" />
    </div>

    <div class="flex items-center gap-2 text-blue-600">
      <svg
        width="32"
        height="30"
        viewBox="0 0 32 30"
        class="w-8 h-[1.875rem]"
        fill="none"
        xmlns="http://www.w3.org/2000/svg">
        <path d="M12.75 13.5L9.75 17.25L12.75 21" fill="currentColor" />
        <path d="M18.75 13.5L21.75 17.25L18.75 21" fill="currentColor" />
        <path
          d="M27.75 27.75C28.5457 27.75 29.3087 27.4339 29.8713 26.8713C30.4339 26.3087 30.75 25.5456 30.75 24.75V9.75C30.75 8.95435 30.4339 8.19129 29.8713 7.62868C29.3087 7.06607 28.5457 6.75 27.75 6.75H15.9C15.3983 6.75492 14.9033 6.63392 14.4605 6.39807C14.0176 6.16222 13.6409 5.81906 13.365 5.4L12.15 3.6C11.8768 3.1852 11.505 2.84472 11.0677 2.60909C10.6305 2.37347 10.1417 2.25008 9.645 2.25H3.75C2.95435 2.25 2.19129 2.56607 1.62868 3.12868C1.06607 3.69129 0.75 4.45435 0.75 5.25V24.75C0.75 25.5456 1.06607 26.3087 1.62868 26.8713C2.19129 27.4339 2.95435 27.75 3.75 27.75H27.75Z"
          fill="currentColor" />
        <path
          d="M12.75 13.5L9.75 17.25L12.75 21M18.75 13.5L21.75 17.25L18.75 21M27.75 27.75C28.5456 27.75 29.3087 27.4339 29.8713 26.8713C30.4339 26.3087 30.75 25.5456 30.75 24.75V9.75C30.75 8.95435 30.4339 8.19129 29.8713 7.62868C29.3087 7.06607 28.5456 6.75 27.75 6.75H15.9C15.3983 6.75492 14.9033 6.63392 14.4605 6.39807C14.0176 6.16222 13.6409 5.81906 13.365 5.4L12.15 3.6C11.8768 3.1852 11.505 2.84472 11.0677 2.60909C10.6305 2.37347 10.1417 2.25008 9.645 2.25H3.75C2.95435 2.25 2.19129 2.56607 1.62868 3.12868C1.06607 3.69129 0.75 4.45435 0.75 5.25V24.75C0.75 25.5456 1.06607 26.3087 1.62868 26.8713C2.19129 27.4339 2.95435 27.75 3.75 27.75H27.75Z"
          stroke="white"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>

      <span class="font-semibold text-xl">Exam App</span>
    </div>
  </header>

  <nav
    class="pt-[3.75rem] flex flex-col justify-between h-[calc(100vh-9.75rem)]">
    <!-- side nav -->
    <ul>
      @for (link of sideNavLinks(); track link.label) {
      <li>
        <a
          class="flex items-center gap-2 p-4 text-gray-500"
          [routerLink]="link.link"
          routerLinkActive="bg-blue-100 !text-blue-500 border border-blue-500">
          <span [innerHTML]="link.icon"></span>
          <span>{{ link.label }}</span>
        </a>
      </li>
      }
    </ul>

    <!-- end side nav -->
    <div class="flex items-center gap-2">
      <div>
        <img
          src="https://placehold.co/54/navy/white"
          class="size-[3.375]"
          alt="user profile" />
      </div>

      <div>
        <p class="font-semibold text-base text-blue-600 font-geist-mono">
          First name
        </p>

        <p class="font-normal text-sm text-gray-500 font-geist-mono">
          user-email@example.com
        </p>
      </div>

      <div>
        <app-menu
          [dropdownItems]="dropdownItems()"
          (menuAction)="handleMenuAction($event)" />
      </div>
    </div>
  </nav>
</aside>
