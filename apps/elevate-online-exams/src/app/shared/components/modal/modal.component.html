<dialog
  id="reusable-dialog"
  class="backdrop:bg-black backdrop:opacity-50 min-h-100 top-1/2 start-1/2 -translate-1/2 font-geist-mono"
  [class.w-100]="!dialogClass()"
  [class]="dialogClass()">
  <button
    type="button"
    class="flex w-full justify-end p-4"
    (click)="closeDialog()">
    <svg
      width="18"
      height="18"
      viewBox="0 0 18 18"
      class="size-[1.125rem] text-gray-400"
      fill="none"
      xmlns="http://www.w3.org/2000/svg">
      <path
        d="M13.5 4.5L4.5 13.5M4.5 4.5L13.5 13.5"
        stroke="currentColor"
        stroke-width="1.25"
        stroke-linecap="round"
        stroke-linejoin="round" />
    </svg>
  </button>

  <ng-container [ngTemplateOutlet]="template()" />
</dialog>
